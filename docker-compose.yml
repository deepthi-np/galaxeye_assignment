version: "3.9"
services:
  web:
    build: ./web
    ports: ["3000:3000"]
    depends_on: [api]
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public

  api:
    build: ./api
    ports: ["8080:8080"]
    volumes: 
      - ./data:/data
      - ./api/src:/app/src
    environment:
      - WORKER_CMD=python /app/worker.py
    depends_on: [worker]

  worker:
    build: ./worker
    volumes:
      - ./data:/data
      - ./worker:/app

volumes:
  data: